<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Lune | Your Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="cart-page">

<header class="navbar">
  <a class="logo" href="index.html"><span>La Lune</span><small>FRENCH BISTRO</small></a>
  <nav>
    <a href="index.html#home">HOME</a><a href="index.html#menu">MENU</a><a href="index.html#about">ABOUT US</a><a href="index.html#book-table">BOOK TABLE</a><a href="index.html#contact">CONTACT</a>
  </nav>
  <div class="nav-actions">
    <button class="icon-btn" aria-label="Search">⌕</button>
    <a class="cart-btn" href="cart.html">🛒<b id="cartCount">0</b></a>
    <a class="order-btn" href="order.html">ORDER NOW</a>
  </div>
</header>

<main>
<section class="cart-hero">
  <p class="script">✦ Review Your Selection ✦</p>
  <h1>YOUR <span>CART</span></h1>
  <p>Check your items before placing the order.</p>
</section>

<section class="cart-layout">
  <div class="cart-items" id="cartItems"></div>

  <aside class="summary">
    <h2>ORDER SUMMARY</h2>
    <div class="summary-row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div>
    <div class="summary-row"><span>Delivery Fee</span><strong id="delivery">₹40</strong></div>
    <div class="summary-total"><span>Total</span><strong id="total">₹40</strong></div>
    <button class="checkout-btn" onclick="checkout()">PROCEED TO CHECKOUT →</button>
    <a class="continue" href="index.html#menu">← Continue Shopping</a>
  </aside>
</section>
</main>

<script src="cart.js"></script>
</body>
</html>
